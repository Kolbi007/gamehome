# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Brukes av release.yml med versjon fra taggen.
  workflow_call:
    inputs:
      version:
        description: Versjon fra taggen, for eksempel v0.1.0
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  CI: "true"

jobs:
  # Plattformnøytrale prosjekter og tester. Beviser at kjernen bygger utenfor Windows (samme som på Mac).
  core:
    name: Core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test --project tests/GameHome.Core.Tests -c Release

  # Windows: hele løsningen og signert test-MSIX for Legion Go.
  windows:
    name: App (Windows, ${{ matrix.arch }}${{ matrix.aot && ', AOT' || '' }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        aot: [false]
        include:
          # Native AOT-variant for måling i fase 0B. Ikke med i release før den er valgt.
          - arch: x64
            aot: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        if: matrix.arch == 'x64'
        run: dotnet test --project tests/GameHome.Core.Tests -c Release

      - name: Set package version
        if: inputs.version != ''
        shell: pwsh
        run: |
          $v = '${{ inputs.version }}'.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Ugyldig versjon: $v (forventet vX.Y.Z)" }
          $m = 'src/GameHome.App/Package.appxmanifest'
          $xml = Get-Content $m -Raw
          $xml = [regex]::Replace($xml, '(<Identity [^>]*Version=")[^"]+', "`${1}$v.0")
          Set-Content $m $xml -NoNewline
          Write-Host "Pakkeversjon: $v.0"

      - name: Import signing certificate
        id: cert
        shell: pwsh
        env:
          DEV_CERT_PFX_BASE64: ${{ secrets.DEV_CERT_PFX_BASE64 }}
          DEV_CERT_PASSWORD: ${{ secrets.DEV_CERT_PASSWORD }}
        run: |
          if (-not $env:DEV_CERT_PFX_BASE64) {
            Write-Host '::warning::DEV_CERT_PFX_BASE64 mangler; MSIX bygges usignert.'
            "thumbprint=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'dev.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:DEV_CERT_PFX_BASE64))
          $pw = ConvertTo-SecureString $env:DEV_CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -Password $pw -CertStoreLocation Cert:\CurrentUser\My
          Remove-Item $pfx
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Build MSIX
        shell: pwsh
        run: |
          $arch = '${{ matrix.arch }}'
          $platform = if ($arch -eq 'arm64') { 'ARM64' } else { 'x64' }
          $publishArgs = @(
            'publish', 'src/GameHome.App', '-c', 'Release', "-r", "win-$arch", "-p:Platform=$platform",
            '-p:GenerateAppxPackageOnBuild=true', "-p:AppxPackageDir=$PWD\artifacts\msix\"
          )
          if ('${{ steps.cert.outputs.thumbprint }}') {
            $publishArgs += '-p:PackageCertificateThumbprint=${{ steps.cert.outputs.thumbprint }}'
          }
          if ('${{ matrix.aot }}' -eq 'true') { $publishArgs += '-p:GameHomeAot=true' }
          dotnet @publishArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msix = Get-ChildItem artifacts\msix -Recurse -Filter *.msix | Select-Object -First 1
          $pub = Get-ChildItem src\GameHome.App\bin -Recurse -Directory -Filter publish | Select-Object -First 1
          $unpacked = (Get-ChildItem $pub.FullName -Recurse -File | Measure-Object Length -Sum).Sum
          $variant = if ('${{ matrix.aot }}' -eq 'true') { 'Native AOT' } else { 'JIT + ReadyToRun' }
          "### $arch, $variant" >> $env:GITHUB_STEP_SUMMARY
          "- MSIX: {0:N1} MB" -f ($msix.Length / 1MB) >> $env:GITHUB_STEP_SUMMARY
          "- Utpakket: {0:N1} MB" -f ($unpacked / 1MB) >> $env:GITHUB_STEP_SUMMARY

      - name: Remove signing certificate
        if: always() && steps.cert.outputs.thumbprint != ''
        shell: pwsh
        run: Remove-Item "Cert:\CurrentUser\My\${{ steps.cert.outputs.thumbprint }}" -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: gamehome-msix-${{ matrix.arch }}${{ matrix.aot && '-aot' || '' }}
          path: |
            artifacts/msix/**/*.msix
            certs/GameHome-Dev.cer
            scripts/Install-DevBuild.ps1
          if-no-files-found: error
          retention-days: 14
