# SPDX-License-Identifier: GPL-3.0-or-later
# Hver sammenslåing til main gir en nyere Beta-prerelease. En tagg vX.Y.Z gir en Stable-release.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: gamehome-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Test release versions
        shell: pwsh
        run: ./scripts/Test-ReleaseVersion.ps1
      - id: v
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MINIMUM_VERSION: ${{ vars.GAMEHOME_MIN_PACKAGE_VERSION }}
        run: |
          $tags = @(gh api --paginate "repos/$env:GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name')
          if ($LASTEXITCODE -ne 0) { throw 'Could not read existing release tags' }
          $requested = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { '' }
          $tag = ./scripts/Get-NextReleaseVersion.ps1 -Tags $tags -MinimumVersion $env:MINIMUM_VERSION -RequestedTag $requested
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Versjon: $tag"

  build:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.tag }}
    secrets: inherit

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          shopt -s globstar nullglob
          # Bare standardvariantene (Native AOT, ADR 0005); JIT-artefaktet er for sammenligning.
          msix=(dist/gamehome-msix-x64/**/*.msix dist/gamehome-msix-arm64/**/*.msix)
          if [ ${#msix[@]} -eq 0 ]; then echo "Fant ingen MSIX" >&2; exit 1; fi
          release_args=()
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then release_args+=(--prerelease); fi
          gh release create "$TAG" \
            "${msix[@]}" \
            dist/gamehome-msix-x64/certs/GameHome-Dev.cer \
            dist/gamehome-msix-x64/scripts/Install-DevBuild.ps1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GameHome $TAG" \
            "${release_args[@]}" \
            --notes "Bygg fra main. GameHome på Legion Go finner det selv (strømmenyen øverst til høyre → Oppdater). Første installasjon: kjør Install-DevBuild.ps1 som administrator med stien til .msix-filen. Se README."
