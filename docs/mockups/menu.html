<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameHome – menyforslag</title>
<style>
  :root{color-scheme:dark;--base:#121110;--surface:#1d1b19;--primary:#f3f0eb;--secondary:#b3aca3;--tertiary:#7e776f;font-family:"Segoe UI Variable Text","Segoe UI",sans-serif;background:var(--base);color:var(--primary)}
  *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:36px 5%}
  button{font:inherit;color:inherit;cursor:pointer} button:focus-visible{outline:2px solid var(--primary);outline-offset:2px} button:hover{background:#35312d}
  .screen{width:min(940px,100%);background:var(--base);border:1px solid var(--surface);border-radius:18px;padding:28px}
  header{display:flex;align-items:center;gap:20px;margin-bottom:18px} h1{font-family:"Segoe UI Variable Display","Segoe UI",sans-serif;font-size:32px;font-weight:600;line-height:1.2;margin:0;flex:1}
  .clock{color:var(--secondary);font-size:20px;white-space:nowrap}.close{width:112px;min-height:52px;border:1px solid #46413c;border-radius:8px;background:var(--surface);font-size:18px}
  .status{color:var(--secondary);font-size:16px;margin:0 0 20px}.panel{display:grid;grid-template-columns:minmax(220px, 0.8fr) minmax(0,1.2fr);gap:28px}
  nav{display:flex;flex-direction:column;gap:10px} nav button,.row{width:100%;min-height:56px;text-align:left;padding:0 18px;border:1px solid #393530;border-radius:8px;background:var(--surface);font-size:18px}
  nav button[aria-current="page"]{background:#34302c;border-color:#8b8379;color:var(--primary)}
  .content h2{font-size:22px;font-weight:600;margin:0 0 14px}.rows{display:flex;flex-direction:column;gap:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:64px}
  .row-name{display:block}.row-detail{display:block;font-size:14px;color:var(--secondary);margin-top:2px}.row-action{font-size:14px;color:var(--secondary);white-space:nowrap}.explanation{font-size:14px;color:var(--secondary);line-height:1.45;margin:16px 0 0}
  footer{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:25px;font-size:14px;color:var(--secondary)}.hints{display:flex;gap:18px}.key{display:inline-grid;place-items:center;border:1px solid var(--tertiary);border-radius:50%;width:22px;height:22px;font-size:12px;margin-right:5px;color:var(--primary)}.concept{color:var(--tertiary)}
  @media(max-width:700px){body{display:block;padding:0}.screen{border:0;border-radius:0;padding:24px 5%;min-height:100vh}header{flex-wrap:wrap;gap:12px}h1{font-size:28px;flex-basis:100%}.panel{grid-template-columns:1fr;gap:28px}footer{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main class="screen">
  <header><h1>Innstillinger og strøm</h1><span class="clock">78 % · 20:42</span><button class="close" type="button" aria-label="Lukk, kun eksempel">Lukk</button></header>
  <p class="status">GameHome · Ingen spill kjører</p>
  <div class="panel">
    <nav aria-label="Innstillingskategorier">
      <button type="button" data-category="Hurtigvalg">Hurtigvalg</button>
      <button type="button" data-category="Utseende og lyd">Utseende og lyd</button>
      <button type="button" data-category="Kontoer og kilder" aria-current="page">Kontoer og kilder</button>
      <button type="button" data-category="System">System</button>
      <button type="button" data-category="Strøm">Strøm</button>
    </nav>
    <section class="content" aria-live="polite">
      <h2 id="section-title">Kontoer og kilder</h2>
      <div id="section-body">
        <div class="rows">
          <button class="row" type="button"><span><span class="row-name">IGDB</span><span class="row-detail">Spillinformasjon og spilletid · Testet</span></span><span class="row-action">Konfigurer ›</span></button>
          <button class="row" type="button"><span><span class="row-name">Steam</span><span class="row-detail">Bibliotek og installasjon · Testet</span></span><span class="row-action">Konfigurer ›</span></button>
          <button class="row" type="button"><span><span class="row-name">SteamGridDB</span><span class="row-detail">Bilder · Ikke konfigurert</span></span><span class="row-action">Konfigurer ›</span></button>
          <button class="row" type="button"><span><span class="row-name">Vibepollo</span><span class="row-detail">Gaming-PC · Ikke konfigurert</span></span><span class="row-action">Konfigurer ›</span></button>
        </div>
        <p class="explanation">Statusene er eksempler; bare kategoriene kan forhåndsvises her.</p>
      </div>
    </section>
  </div>
  <footer><div class="hints"><span><span class="key">A</span> Velg</span><span><span class="key">B</span> Tilbake</span></div><span class="concept">Designforslag – ikke implementert</span></footer>
</main>
<script>
  const title=document.querySelector('#section-title'), body=document.querySelector('#section-body');
  const accounts=body.innerHTML;
  const summaries={
    'Hurtigvalg':'Lysstyrke, volum, Wi-Fi, Bluetooth og tilgjengelig ytelse.',
    'Utseende og lyd':'Menylyder, bevegelse, lysbildefremvisning og trailere.',
    'System':'Oppdateringer, versjon og feilsøking.',
    'Strøm':'Dvale, omstart, avslåing og avslutt GameHome. Handlinger krever en egen bekreftelse.'
  };
  document.querySelectorAll('nav button').forEach(button=>button.addEventListener('click',()=>{
    document.querySelectorAll('nav button').forEach(item=>item.removeAttribute('aria-current'));
    button.setAttribute('aria-current','page');title.textContent=button.dataset.category;
    if(button.dataset.category==='Kontoer og kilder') body.innerHTML=accounts;
    else {body.replaceChildren();const p=document.createElement('p');p.className='explanation';p.textContent=summaries[button.dataset.category];body.append(p);}
  }));
</script>
</body>
</html>
